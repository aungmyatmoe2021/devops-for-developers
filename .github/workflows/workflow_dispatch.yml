name: Manual Docker Build

on:
  workflow_dispatch:
    inputs:
      service:
        description: "Choose Docker Service to build"
        required: true
        default: "frontend"
        type: choice
        options:
          - frontend
          - backend
          - integration

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
  IMAGE_TAG: ${GITHUB_SHA::7}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set Docker Variables
        run: |
          echo "APP_NAME=${{ inputs.service }}-app" >> $GITHUB_ENV
          echo "DOCKERFILE=apps/${{ inputs.service }}/Dockerfile" >> $GITHUB_ENV

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build \
          -t ${{ env.DOCKER_USERNAME }}/myapp:${GITHUB_SHA::7} \
          .

      - name: Push Docker Image
        run: |
          docker push \
          ${{ env.DOCKER_USERNAME }}/myapp:${GITHUB_SHA::7}
