name: Manual Docker Build

on:
  workflow_dispatch:
    inputs:
      service:
        description: "Choose Docker Service to build"
        required: true
        default: "frontend"
        type: choice
        options:
          - frontend
          - backend
          - integration

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set Docker Variables
        run: |
          SHORT_SHA=$(echo $IMAGE_TAG | cut -c1-7)
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV

          echo "DOCKERFILE_PATH=apps/${{ inputs.service }}/Dockerfile" >> $GITHUB_ENV
          echo "IMAGE_NAME=${{ env.DOCKER_USERNAME }}/myapp-${{ inputs.service }}" >> $GITHUB_ENV

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build \
          -f ${{ env.DOCKERFILE_PATH }} \
          -t ${{ env.IMAGE_NAME }}:${{ env.SHORT_SHA }} \
          -t ${{ env.IMAGE_NAME }}:latest \
          .

      - name: Push Docker Image
        run: |
          docker push ${{ env.IMAGE_NAME }}:${{ env.SHORT_SHA }}
          docker push ${{ env.IMAGE_NAME }}:latest
